<div class="relative">
    <div class="flex flex-col md:flex-row justify-between items-start mb-8 border-b border-gray-100 dark:border-gray-700 pb-6 pr-12">
        <div class="max-w-[70%] md:max-w-none">
            <div class="flex items-center gap-3 mb-2">
                <i class="{{ exp.icon }} {{ exp.iconColor }} text-2xl"></i>
                <h2 class="text-3xl font-black text-gray-900 dark:text-white leading-tight">{{ exp.company }}</h2>
            </div>
            <p class="text-brand-accent font-bold uppercase tracking-wider text-sm">{{ exp.role }}</p>
        </div>

        <div class="mt-4 md:mt-0">
            <span class="modal-date-badge text-xs font-mono text-gray-500 bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-full border border-gray-200 dark:border-gray-700 shadow-sm">
                <i class="far fa-calendar-alt mr-1.5"></i> {{ exp.period }}
            </span>
        </div>
    </div>

    <div class="space-y-6">
        <p class="text-gray-600 dark:text-gray-300 leading-relaxed">{{ exp.brief }}</p>
    </div>
</div>

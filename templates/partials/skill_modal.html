<div class="p-2 md:p-6">
    <div class="flex flex-col md:flex-row justify-between items-start gap-6 border-b dark:border-gray-700 pb-8 mb-8">
        <div class="flex-1">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-14 h-14 rounded-xl bg-brand-accent flex items-center justify-center text-black text-2xl shadow-lg shadow-brand-accent/20 border dark:border-gray-700">
                    <i class="{{ skill.iconClass }}"></i>
                </div>
                <h2 class="text-3xl md:text-4xl font-black text-gray-900 dark:text-white leading-tight">
                    {{ skill.title }}
                </h2>
            </div>

            <div class="flex flex-wrap gap-2">
                <span class="bg-brand-accent/10 dark:bg-brand-accent/5 text-brand-accent px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest border border-brand-accent/20">
                    Core Competency
                </span>
            </div>
        </div>
    </div>

    <div class="prose dark:prose-invert max-w-none">
        <h4 class="text-xs font-black uppercase tracking-[0.3em] text-gray-400 mb-4">Overview</h4>

        <p class="text-gray-600 dark:text-gray-400 text-lg leading-relaxed mb-10 bg-gray-50 dark:bg-gray-900/30 p-6 rounded-3xl border dark:border-gray-700">
            {{ skill.desc }}
        </p>

        <div class="mt-8">
            <h4 class="text-xs font-black uppercase tracking-[0.3em] text-gray-400 mb-4">Technical Stack</h4>
            <div class="flex flex-wrap gap-2">
                {% for item in skill.core %}
                <span class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-xl text-sm font-bold shadow-sm border border-gray-100 dark:border-gray-700 hover:border-brand-accent transition-colors">
                    {{ item }}
                </span>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

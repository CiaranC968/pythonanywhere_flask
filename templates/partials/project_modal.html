{# templates/partials/project_modal.html #}
<div class="p-2 md:p-6">
    <div class="flex flex-col md:flex-row justify-between items-start gap-6 border-b dark:border-gray-700 pb-8 mb-8">
        <div class="flex-1">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-14 h-14 rounded-xl bg-gray-50 dark:bg-gray-900/50 flex items-center justify-center {{ p.color }} text-2xl shadow-sm border dark:border-gray-700">
                    <i class="{{ p.icon }}"></i>
                </div>
                <h2 id="modalTitle" class="text-4xl font-black text-gray-900 dark:text-white leading-tight">
                    {{ p.title }}
                </h2>
            </div>
            
            <div id="modalStack" class="flex flex-wrap gap-2">
                {% for t in p.stack or [] %}
                <span class="bg-brand-accent/10 dark:bg-brand-accent/5 text-brand-accent px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest border border-brand-accent/20">
                    {{ t }}
                </span>
                {% endfor %}
            </div>
        </div>

        {% if p.link and p.link != "#" %}
        <a href="{{ p.link }}" target="_blank" 
           class="w-full md:w-auto bg-gray-900 dark:bg-white dark:text-gray-900 text-white font-bold py-3 px-6 rounded-2xl shadow-lg hover:scale-105 transition-all flex items-center justify-center gap-3">
            <i class="fab fa-github text-xl"></i>
            <span>View Source Code</span>
        </a>
        {% endif %}
    </div>

    <div class="prose dark:prose-invert max-w-none">
        <h4 class="text-xs font-black uppercase tracking-[0.3em] text-gray-400 mb-4">Project Overview</h4>
        <p id="modalDescription" class="text-gray-600 dark:text-gray-400 text-lg leading-relaxed mb-10 bg-gray-50 dark:bg-gray-900/30 p-6 rounded-3xl border dark:border-gray-700">
            {{ p.desc }}
        </p>
    </div>
    
    {% if p.image %}
    <div class="mt-8 rounded-[2rem] overflow-hidden border dark:border-gray-700 shadow-xl">
        <img src="{{ url_for('static', filename='images/projects/' + p.image) }}" alt="{{ p.title }} Screenshot" class="w-full h-auto">
    </div>
    {% endif %}
</div>

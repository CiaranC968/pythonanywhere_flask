
{# templates/partials/project_modal.html #}
{# Expects a single project dict in variable `p` #}
<div>
    <div id="modalTitle" class="text-4xl font-black mb-4 text-gray-900 dark:text-white">{{ p.title }}</div>

    <div id="modalStack" class="flex gap-2 mb-8 flex-wrap">
        {% for t in p.stack or [] %}
        <span class="bg-gray-100 dark:bg-gray-700 px-3 py-1 rounded text-sm font-bold text-gray-600 dark:text-gray-300">{{ t }}</span>
        {% endfor %}
    </div>

    <p id="modalDescription" class="text-gray-600 dark:text-gray-400 text-lg leading-relaxed mb-10">
        {{ p.desc }}
    </p>

    {% if p.link and p.link != "#" %}
    {{ p.link }}
    <i class="fab fa-github" aria-hidden="true"></i> View Source Code
    {% endif %}
</div>

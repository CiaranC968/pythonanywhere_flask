<div class="space-y-8">
    {% for edu in education %}
    <div class="flex items-center gap-6 border-b dark:border-gray-700 pb-6">
        <div class="w-20 h-20 bg-white rounded-2xl p-3 flex items-center justify-center shadow-sm overflow-hidden">
            <img src="{{ url_for('static', filename='images/ou-logo.png') }}"
                 alt="University Logo"
                 class="max-h-full object-contain">
        </div>

        <div>
            <h2 class="text-3xl font-black dark:text-white leading-tight">{{ edu.degree | safe }}</h2>
            <p class="text-brand-accent font-bold text-lg uppercase tracking-wide">{{ edu.university }}</p>
            <p class="text-gray-500 text-sm font-medium">{{ edu.year }}</p>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-8 mt-6">
        {% for stage_name, modules in edu.stages.items() %}
        <div>
            <h4 class="text-xs font-black uppercase tracking-[0.2em] text-gray-400 mb-4">{{ stage_name }}</h4>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {% for module in modules %}
                <div class="flex items-center gap-3 bg-gray-50 dark:bg-gray-900/50 p-4 rounded-xl border border-gray-100 dark:border-gray-800 hover:border-brand-accent transition-colors group">
                    <span class="text-[10px] font-bold bg-brand-accent text-black px-2 py-1 rounded uppercase shadow-sm">
                        {{ module.code }}
                    </span>
                    <span class="text-sm font-medium dark:text-gray-300 group-hover:text-white transition-colors">
                        {{ module.title }}
                    </span>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
</div>

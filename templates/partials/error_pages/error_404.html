<!-- partials/error_404.html - For HTMX fragment 404 errors -->
<div class="load-error col-span-full text-center py-12">
    <div class="w-16 h-16 bg-red-100 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-exclamation-triangle text-2xl text-red-500" aria-hidden="true"></i>
    </div>
    <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-2">Content Not Found</h3>
    <p class="text-gray-600 dark:text-gray-400 text-sm mb-4">The requested content could not be loaded.</p>
    <button onclick="location.reload()"
            class="inline-flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm font-medium rounded-lg transition-colors">
        <i class="fas fa-redo" aria-hidden="true"></i> Refresh Page
    </button>
</div>

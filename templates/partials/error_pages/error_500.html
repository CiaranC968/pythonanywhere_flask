<div class="load-error col-span-full py-12 text-center" role="alert">
    <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/20">
        <i class="fas fa-exclamation-circle text-2xl text-red-500" aria-hidden="true"></i>
    </div>
    <h3 class="mb-2 text-lg font-bold text-gray-800 dark:text-white">Content could not be loaded</h3>
    <p class="mb-4 text-sm text-gray-600 dark:text-gray-400">The server hit an unexpected error. Try loading this section again.</p>
    <button type="button" data-reload-page class="inline-flex items-center gap-2 rounded-lg bg-red-500 px-4 py-2 text-sm font-medium text-white hover:bg-red-600">
        <i class="fas fa-redo" aria-hidden="true"></i> Refresh page
    </button>
</div>

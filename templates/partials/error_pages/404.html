<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page Not Found | Ciaran Cairns</title>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome (self-hosted) -->
    <link rel="stylesheet" href="/static/css/fontawesome/all.min.css">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { dark: '#111827', accent: '#facc15', hover: '#f59e0b' } }
                }
            }
        };
    </script>

    <!-- Theme initialization -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (theme === 'dark' || (!theme && systemDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-6">
    <div class="text-center max-w-lg">
        <!-- 404 Illustration -->
        <div class="mb-8">
            <span class="text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-red-600">
                404
            </span>
        </div>

        <!-- Error Message -->
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-white mb-4">
            Page Not Found
        </h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8 text-lg">
            Sorry, the page you're looking for doesn't exist or has been moved.
        </p>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/"
               class="inline-flex items-center justify-center gap-2 bg-brand-accent text-brand-dark font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-brand-hover hover:shadow-xl transition-all transform hover:-translate-y-1">
                <i class="fas fa-home" aria-hidden="true"></i>
                Back to Home
            </a>
            <button onclick="history.back()"
                    class="inline-flex items-center justify-center gap-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold py-3 px-6 rounded-xl shadow hover:bg-gray-300 dark:hover:bg-gray-600 transition-all">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                Go Back
            </button>
        </div>

        <!-- Helpful Links -->
        <div class="mt-12 pt-8 border-t border-gray-200 dark:border-gray-700">
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Looking for something specific?</p>
            <div class="flex flex-wrap justify-center gap-4 text-sm">
                <a href="/#about" class="text-brand-accent hover:underline">About</a>
                <a href="/#projects" class="text-brand-accent hover:underline">Projects</a>
                <a href="/#experience" class="text-brand-accent hover:underline">Experience</a>
                <a href="/#contact" class="text-brand-accent hover:underline">Contact</a>
            </div>
        </div>
    </div>
</body>
</html>

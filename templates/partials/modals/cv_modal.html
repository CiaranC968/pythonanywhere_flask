<div class="h-[84vh] flex flex-col">
    <!-- Header -->
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-warm-200 dark:border-gray-800">
        <div>
            <h3 class="text-2xl font-black dark:text-white leading-tight">Customise & View Resume</h3>
            <p class="text-brand-accent font-bold text-[10px] uppercase tracking-widest mt-0.5">Build your version in real-time</p>
        </div>
        <a href="/get-cv"
           id="cv-download-btn"
           download
           class="bg-brand-dark text-white dark:bg-brand-accent dark:text-brand-dark px-5 py-2.5 rounded-xl text-xs font-black hover:scale-105 active:scale-95 transition-all flex items-center gap-2 shadow-md">
            <i class="fas fa-download"></i> Download PDF
        </a>
    </div>

    <!-- Dual Panel Layout -->
    <div class="grow flex flex-col md:flex-row gap-6 min-h-0">
        <!-- Settings Sidebar -->
        <div class="w-full md:w-72 shrink-0 flex flex-col justify-between space-y-4 overflow-y-auto max-h-[35vh] md:max-h-full pb-3 border-b md:border-b-0 md:border-r border-warm-200 dark:border-gray-800 pr-0 md:pr-4">
            <div class="space-y-4">
                <!-- Theme Accent -->
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wider text-warm-500 dark:text-gray-400 mb-1.5">Theme Accent</label>
                    <select id="cv-custom-theme" class="w-full bg-white dark:bg-gray-800 border border-warm-200 dark:border-gray-700 rounded-xl px-3 py-2 text-xs text-warm-900 dark:text-white font-bold focus:outline-none focus:ring-2 focus:ring-brand-accent">
                        <option value="burgundy">Burgundy (Default)</option>
                        <option value="yellow">Amber Yellow</option>
                        <option value="blue">Indigo Blue</option>
                        <option value="green">Emerald Green</option>
                        <option value="slate">Dark Slate</option>
                    </select>
                </div>

                <!-- Subtitle Override -->
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wider text-warm-500 dark:text-gray-400 mb-1.5">Subtitle Override</label>
                    <input type="text" id="cv-custom-subtitle" placeholder="e.g. Software Engineer" class="w-full bg-white dark:bg-gray-800 border border-warm-200 dark:border-gray-700 rounded-xl px-3 py-2 text-xs text-warm-900 dark:text-white font-bold focus:outline-none focus:ring-2 focus:ring-brand-accent">
                </div>

                <!-- Include Sections checkboxes -->
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wider text-warm-500 dark:text-gray-400 mb-2">Include Sections</label>
                    <div class="space-y-2 bg-warm-50/50 dark:bg-gray-800/30 p-3 rounded-xl border border-warm-200/50 dark:border-gray-850">
                        <label class="flex items-center gap-2.5 text-xs font-bold text-warm-700 dark:text-gray-300 cursor-pointer select-none">
                            <input type="checkbox" id="sect-experience" value="experience" checked class="w-4 h-4 rounded border-warm-300 text-brand-accent focus:ring-brand-accent">
                            <span>Work Experience</span>
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-bold text-warm-700 dark:text-gray-300 cursor-pointer select-none">
                            <input type="checkbox" id="sect-skills" value="skills" checked class="w-4 h-4 rounded border-warm-300 text-brand-accent focus:ring-brand-accent">
                            <span>Technical Skills</span>
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-bold text-warm-700 dark:text-gray-300 cursor-pointer select-none">
                            <input type="checkbox" id="sect-projects" value="projects" checked class="w-4 h-4 rounded border-warm-300 text-brand-accent focus:ring-brand-accent">
                            <span>Featured Projects</span>
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-bold text-warm-700 dark:text-gray-300 cursor-pointer select-none">
                            <input type="checkbox" id="sect-education" value="education" checked class="w-4 h-4 rounded border-warm-300 text-brand-accent focus:ring-brand-accent">
                            <span>Education</span>
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-bold text-warm-700 dark:text-gray-300 cursor-pointer select-none">
                            <input type="checkbox" id="sect-certificates" value="certificates" checked class="w-4 h-4 rounded border-warm-300 text-brand-accent focus:ring-brand-accent">
                            <span>Certifications</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Update Action button -->
            <button onclick="updateCVPreview()" class="w-full bg-brand-accent text-brand-dark font-black py-3 rounded-xl hover:opacity-90 active:scale-98 transition-all flex items-center justify-center gap-2 shadow-sm cursor-pointer text-xs">
                <i class="fas fa-sync-alt animate-spin-slow"></i> Update Preview
            </button>
        </div>

        <!-- PDF Preview Panel -->
        <div class="grow h-full min-h-[45vh] md:min-h-0 rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-700 bg-[#525659]">
            <object id="cv-preview-object" data="/get-cv#view=Fit" type="application/pdf" class="w-full h-full">
                <iframe id="cv-preview-iframe" src="/get-cv#view=Fit" class="w-full h-full" frameborder="0">
                    <p class="p-10 text-center dark:text-white text-xs">
                        Preview not available. <a id="cv-fallback-link" href="/get-cv" class="underline">Download PDF</a>.
                    </p>
                </footer>
            </object>
        </div>
    </div>
</div>

<script>
function updateCVPreview() {
    const theme = document.getElementById('cv-custom-theme').value;
    const subtitle = encodeURIComponent(document.getElementById('cv-custom-subtitle').value.trim());
    
    const sections = [];
    ['experience', 'skills', 'projects', 'education', 'certificates'].forEach(sec => {
        if (document.getElementById('sect-' + sec).checked) {
            sections.push(sec);
        }
    });
    
    let url = `/get-cv?theme=${theme}`;
    if (subtitle) {
        url += `&subtitle=${subtitle}`;
    }
    if (sections.length > 0) {
        url += `&sections=${sections.join(',')}`;
    }
    
    // Update preview DOM elements
    const pdfObject = document.getElementById('cv-preview-object');
    const pdfIframe = document.getElementById('cv-preview-iframe');
    const downloadBtn = document.getElementById('cv-download-btn');
    const fallbackLink = document.getElementById('cv-fallback-link');
    
    if (pdfObject) {
        pdfObject.data = url + '#view=Fit';
    }
    if (pdfIframe) {
        pdfIframe.src = url + '#view=Fit';
    }
    if (downloadBtn) {
        downloadBtn.href = url;
    }
    if (fallbackLink) {
        fallbackLink.href = url;
    }
}
</script>

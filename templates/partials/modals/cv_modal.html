<div class="h-[84vh] flex flex-col">
    <!-- Header -->
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-warm-200 dark:border-gray-800">
        <div>
            <h3 class="text-2xl font-black dark:text-white leading-tight">View Resume</h3>
            <p class="text-brand-accent font-bold text-[10px] uppercase tracking-widest mt-0.5">Official Professional CV</p>
        </div>
        <a href="/get-cv"
           id="cv-download-btn"
           download
           class="bg-brand-dark text-white dark:bg-brand-accent dark:text-brand-dark px-5 py-2.5 rounded-xl text-xs font-black hover:scale-105 active:scale-95 transition-all flex items-center gap-2 shadow-md">
            <i class="fas fa-download"></i> Download PDF
        </a>
    </div>

    <!-- Full-Width Preview Panel -->
    <div class="grow flex flex-col min-h-0">
        <div class="grow h-full min-h-[45vh] md:min-h-0 rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-700 bg-[#525659]">
            <object id="cv-preview-object" data="/get-cv#view=Fit" type="application/pdf" class="w-full h-full">
                <iframe id="cv-preview-iframe" src="/get-cv#view=Fit" class="w-full h-full" frameborder="0">
                    <p class="p-10 text-center dark:text-white text-xs">
                        Preview not available. <a id="cv-fallback-link" href="/get-cv" class="underline">Download PDF</a>.
                    </p>
                </iframe >
            </object>
        </div>
    </div>
</div>

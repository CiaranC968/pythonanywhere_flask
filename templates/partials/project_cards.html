{% for p in projects %}
<article
    hx-get="/fragment/project-modal/{{ p.slug }}"
    hx-target="#modalContent"
    hx-trigger="click"
    class="card-hover group relative cursor-pointer bg-white dark:bg-gray-800 rounded-[2rem] p-8 border border-gray-100 dark:border-gray-700 shadow-sm overflow-hidden transition-all hover:shadow-xl hover:-translate-y-1">

    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-25 transition-all duration-500 pointer-events-none">
        <i class="{{ p.bgIcon }} text-9xl {{ p.hoverColor }}"></i>
    </div>

    <div class="relative z-10">
        <div class="flex justify-between items-start mb-6">
            <div class="w-16 h-16 rounded-2xl bg-gray-50 dark:bg-gray-900/50 flex items-center justify-center {{ p.color }} text-3xl shadow-sm group-hover:bg-brand-accent group-hover:text-black transition-all duration-300">
                <i class="{{ p.icon }}"></i>
            </div>
            <i class="fas fa-arrow-right text-gray-300 group-hover:text-brand-accent -rotate-45 group-hover:rotate-0 transition-all duration-300 text-xl"></i>
        </div>

        <h3 class="text-3xl font-bold mb-2 text-gray-900 dark:text-white tracking-tight">{{ p.title }}</h3>

        <div class="flex flex-wrap gap-2 mb-4">
            {% for tech in p.stack %}
            <span class="text-[10px] font-bold uppercase tracking-widest px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded-md dark:text-gray-300">{{ tech }}</span>
            {% endfor %}
        </div>

        <p class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed line-clamp-2">{{ p.quickDesc }}</p>
    </div>
</article>
{% endfor %}

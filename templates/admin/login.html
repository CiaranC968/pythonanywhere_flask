{% extends "admin/base.html" %}

{% block content %}
<section class="admin-login-panel">
    <span class="admin-login-icon"><i class="fas fa-lock" aria-hidden="true"></i></span>
    <h1>Admin login</h1>
    <p>Use the password configured for this portfolio.</p>

    <form method="post">
        <label class="tracker-field" for="password"><span>Password</span><input id="password" name="password" type="password" required autofocus class="admin-input"></label>
        <button class="tracker-primary"><i class="fas fa-arrow-right-to-bracket" aria-hidden="true"></i> Log in</button>
    </form>
</section>
{% endblock %}

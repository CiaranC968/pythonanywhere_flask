{% extends "admin/base.html" %}

{% block content %}
<section class="mx-auto max-w-md rounded-2xl border border-warm-200 bg-white p-8 shadow-sm">
    <h1 class="mb-2 text-3xl font-black text-warm-900">Admin Login</h1>
    <p class="mb-6 text-sm text-warm-500">Use the password from your PythonAnywhere environment variable.</p>

    <form method="post" class="space-y-5">
        <div>
            <label for="password" class="mb-2 block text-sm font-bold text-warm-700">Password</label>
            <input id="password" name="password" type="password" required autofocus class="w-full rounded-xl border border-warm-200 px-4 py-3 outline-none focus:border-brand-accent">
        </div>
        <button class="w-full rounded-xl bg-brand-accent px-5 py-3 font-black text-brand-dark shadow-sm hover:opacity-90">Log in</button>
    </form>
</section>
{% endblock %}
